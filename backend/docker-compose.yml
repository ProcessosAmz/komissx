services:

  postgres:
    image: postgres:16-alpine
    container_name: komissx_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: komissx_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    ports:
      - "${PORT_NEST}:3000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: