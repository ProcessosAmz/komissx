http:
  routers:
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - frontend
      service: frontend

  services:
    frontend:
      loadBalancer:
        healthCheck:
          path: /health
          interval: "5s"
          timeout: "3s"
        servers:
          - url: "http://komissx_frontend_blue:80"