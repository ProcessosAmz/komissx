http:
  routers:
    backend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: backend

  services:
    backend:
      loadBalancer:
        healthCheck:
          path: /api/health
          interval: "5s"
          timeout: "3s"
        servers:
          - url: "http://komissx_backend_blue:3000"