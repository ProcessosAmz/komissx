services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: komissx_frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_EXPOSED_PORT:-8080}:80"