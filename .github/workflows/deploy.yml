name: Deploy Komissx PROD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env
        working-directory: ./backend
        run: |
          $envContent = @"
          AMAZONET_HUB_URL=${{ secrets.AMAZONET_HUB_URL }}
          AMAZONET_HUB_CLIENT_ID=${{ secrets.AMAZONET_HUB_CLIENT_ID }}
          AMAZONET_HUB_CLIENT_SECRET=${{ secrets.AMAZONET_HUB_CLIENT_SECRET }}
          AMAZONET_HUB_USERNAME=${{ secrets.AMAZONET_HUB_USERNAME }}
          AMAZONET_HUB_PASSWORD=${{ secrets.AMAZONET_HUB_PASSWORD }}
          AMAZONET_HUB_GRANT_TYPE=${{ secrets.AMAZONET_HUB_GRANT_TYPE }}
          AMAZONET_METABASE_INSTALACAO_TECNICO=${{ secrets.AMAZONET_METABASE_INSTALACAO_TECNICO }}
          AMAZONET_BOT_TOKEN=${{ secrets.AMAZONET_BOT_TOKEN }}
          MANIA_HUB_URL=${{ secrets.MANIA_HUB_URL }}
          MANIA_HUB_CLIENT_ID=${{ secrets.MANIA_HUB_CLIENT_ID }}
          MANIA_HUB_CLIENT_SECRET=${{ secrets.MANIA_HUB_CLIENT_SECRET }}
          MANIA_HUB_USERNAME=${{ secrets.MANIA_HUB_USERNAME }}
          MANIA_HUB_PASSWORD=${{ secrets.MANIA_HUB_PASSWORD }}
          MANIA_HUB_GRANT_TYPE=${{ secrets.MANIA_HUB_GRANT_TYPE }}
          MANIA_METABASE_INSTALACAO_TECNICO=${{ secrets.MANIA_METABASE_INSTALACAO_TECNICO }}
          MANIA_BOT_TOKEN=${{ secrets.MANIA_BOT_TOKEN }}
          METABASE_INSTALACAO_TECNICO=${{ secrets.METABASE_INSTALACAO_TECNICO }}
          PORT_NEST=${{ secrets.PORT_NEST }}
          DB_HOST=postgres
          DB_PORT=5432
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          "@
          $normalized = ($envContent -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }) -join "`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $normalized + "`n")

      - name: Create frontend .env
        working-directory: ./frontend
        run: |
          $envContent = @"
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          "@
          $normalized = ($envContent -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }) -join "`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $normalized + "`n")

      - name: Start infrastructure
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --wait postgres redis

      - name: Build backend image
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml build backend

      - name: Run migrations
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml run --rm --no-deps backend npm run migration:run

      - name: Verify migrations
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml run --rm --no-deps backend npm run migration:show

      - name: Deploy backend
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --force-recreate backend

      - name: Deploy frontend
        working-directory: ./frontend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --build

      - name: Verify backend DB env
        run: |
          docker exec komissx_backend printenv DB_USERNAME
          docker exec komissx_backend printenv DB_DATABASE

      - name: Docker ps
        run: |
          docker ps

      - name: Backend logs
        working-directory: ./backend
        run: |
          docker compose -f docker/docker-compose.prod.yml logs --tail=50 backend

      - name: Frontend logs
        working-directory: ./frontend
        run: |
          docker compose -f docker/docker-compose.prod.yml logs --tail=50 frontend