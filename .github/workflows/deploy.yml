name: Deploy Komissx PROD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env
        working-directory: ./backend
        run: |
          $envContent = @"
          AMAZONET_HUB_URL=${{ secrets.AMAZONET_HUB_URL }}
          AMAZONET_HUB_CLIENT_ID=${{ secrets.AMAZONET_HUB_CLIENT_ID }}
          AMAZONET_HUB_CLIENT_SECRET=${{ secrets.AMAZONET_HUB_CLIENT_SECRET }}
          AMAZONET_HUB_USERNAME=${{ secrets.AMAZONET_HUB_USERNAME }}
          AMAZONET_HUB_PASSWORD=${{ secrets.AMAZONET_HUB_PASSWORD }}
          AMAZONET_HUB_GRANT_TYPE=${{ secrets.AMAZONET_HUB_GRANT_TYPE }}
          AMAZONET_METABASE_INSTALACAO_TECNICO=${{ secrets.AMAZONET_METABASE_INSTALACAO_TECNICO }}
          AMAZONET_BOT_TOKEN=${{ secrets.AMAZONET_BOT_TOKEN }}
          MANIA_HUB_URL=${{ secrets.MANIA_HUB_URL }}
          MANIA_HUB_CLIENT_ID=${{ secrets.MANIA_HUB_CLIENT_ID }}
          MANIA_HUB_CLIENT_SECRET=${{ secrets.MANIA_HUB_CLIENT_SECRET }}
          MANIA_HUB_USERNAME=${{ secrets.MANIA_HUB_USERNAME }}
          MANIA_HUB_PASSWORD=${{ secrets.MANIA_HUB_PASSWORD }}
          MANIA_HUB_GRANT_TYPE=${{ secrets.MANIA_HUB_GRANT_TYPE }}
          MANIA_METABASE_INSTALACAO_TECNICO=${{ secrets.MANIA_METABASE_INSTALACAO_TECNICO }}
          MANIA_BOT_TOKEN=${{ secrets.MANIA_BOT_TOKEN }}
          METABASE_INSTALACAO_TECNICO=${{ secrets.METABASE_INSTALACAO_TECNICO }}
          HOST_NAME=${{ vars.HOST_NAME }}
          PORT_NEST=${{ secrets.PORT_NEST }}
          APP_VERSION=1.0.${{ github.run_number }}
          SKIP_DATABASE=true
          TZ=America/Manaus
          DB_HOST=postgres
          DB_PORT=5432
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_BIND_ADDRESS=${{ vars.DB_BIND_ADDRESS || '0.0.0.0' }}
          DB_EXPOSED_PORT=${{ vars.DB_EXPOSED_PORT || '5432' }}
          REDIS_BIND_ADDRESS=${{ vars.REDIS_BIND_ADDRESS || '0.0.0.0' }}
          REDIS_EXPOSED_PORT=${{ vars.REDIS_EXPOSED_PORT || '6379' }}
          BACKEND_BIND_ADDRESS=${{ vars.BACKEND_BIND_ADDRESS || '0.0.0.0' }}
          BACKEND_EXPOSED_PORT=${{ vars.BACKEND_EXPOSED_PORT || '3000' }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=8h
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          "@
          $normalized = ($envContent -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }) -join "`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $normalized + "`n")

      - name: Create frontend .env
        working-directory: ./frontend
        run: |
          $envContent = @"
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          FRONTEND_BIND_ADDRESS=${{ vars.FRONTEND_BIND_ADDRESS || '0.0.0.0' }}
          FRONTEND_EXPOSED_PORT=${{ vars.FRONTEND_EXPOSED_PORT || '8080' }}
          "@
          $normalized = ($envContent -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }) -join "`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $normalized + "`n")

      - name: Prefer Git Bash
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Start infrastructure
        working-directory: ./backend
        run: |
          docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --no-recreate --wait --wait-timeout 60 postgres redis

      - name: Deploy backend blue-green
        working-directory: ./backend
        shell: bash
        run: |
          chmod +x docker/deploy-blue-green.sh
          ./docker/deploy-blue-green.sh

      - name: Deploy frontend blue-green
        working-directory: ./frontend
        shell: bash
        run: |
          chmod +x docker/deploy-blue-green.sh
          ./docker/deploy-blue-green.sh

      - name: Docker ps
        run: |
          docker ps

      - name: Backend logs
        working-directory: ./backend
        run: |
          $color = if (Select-String -Path docker/traefik/dynamic/backend.yml -Pattern "backend_green") { "green" } else { "blue" }
          docker compose --env-file .env -f docker/docker-compose.prod.yml --profile $color logs --tail=50 "backend-$color"

      - name: Frontend logs
        working-directory: ./frontend
        run: |
          $color = if (Select-String -Path ../backend/docker/traefik/dynamic/frontend.yml -Pattern "frontend_green") { "green" } else { "blue" }
          docker compose --env-file .env -f docker/docker-compose.prod.yml --profile $color logs --tail=50 "frontend-$color"